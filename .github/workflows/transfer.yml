name: VidFetch isolated API probe
on:
  workflow_dispatch:
    inputs:
      payload:
        required: true
        type: string
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test authorized API with metadata only
        env:
          VIDFETCH_API_KEY: ${{ secrets.VIDFETCH_API_KEY }}
        run: python src/vidfetch_probe.py
