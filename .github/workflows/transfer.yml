name: Transfer Instagram video to Google Drive

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "AES-GCM encrypted job (contains URL and Telegram chat ID)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg and Python runtime packages
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python -m pip install --disable-pip-version-check -r requirements.txt
          ffmpeg -version >/dev/null
      - name: Download and upload privately
        env:
          ENCRYPTED_PAYLOAD: ${{ inputs.payload }}
          PIPELINE_KEY: ${{ secrets.PIPELINE_KEY }}
          GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DRIVE_FOLDER_NAME: Instagram Videos
          PUBLIC_FOLDER: 'true'
        run: python src/transfer.py
