name: Telegram communication compatibility check
on:
  workflow_dispatch:
    inputs:
      payload:
        required: true
        type: string
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check bot communication settings using official Telegram API
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          def call(method, data=None):
              url = "https://api.telegram.org/bot" + os.environ["TELEGRAM_BOT_TOKEN"] + "/" + method
              try:
                  req = urllib.request.Request(url, data=json.dumps(data).encode() if data is not None else None, headers={"Content-Type":"application/json"})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  return json.load(e)
              except Exception:
                  return {"ok":False,"description":"transport failure"}
          r = call("getMe")
          if not r.get("ok"):
              print("BOT_SETTINGS_READ_FAILED")
              raise SystemExit(1)
          enabled = r["result"].get("can_communicate_with_bots", False)
          print("BOT_TO_BOT_ENABLED:", enabled)
          if not enabled:
              print("BOTFATHER_SETTING_REQUIRED")
              raise SystemExit(0)
          for bot in ["@TopSaverBot", "@quicksbot"]:
              result = call("sendMessage", {"chat_id":bot, "text":"/start"})
              description = result.get("description","").lower()
              code = "ACCEPTED" if result.get("ok") else "BOT_TO_BOT_DISABLED" if "bot" in description and ("disabled" in description or "can't" in description or "cannot" in description or "forbidden" in description) else "REJECTED_HTTP_" + str(result.get("error_code","UNKNOWN"))
              print(bot,code)
          PY
