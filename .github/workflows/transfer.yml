name: Transfer Instagram video to Google Drive

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "AES-GCM encrypted job (contains URL and Telegram chat ID)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Python packages and bundled FFmpeg
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -c 'from imageio_ffmpeg import get_ffmpeg_exe; import subprocess; subprocess.run([get_ffmpeg_exe(), "-version"], check=True, stdout=subprocess.DEVNULL)'
      - name: Download and upload privately
        env:
          ENCRYPTED_PAYLOAD: ${{ inputs.payload }}
          PIPELINE_KEY: ${{ secrets.PIPELINE_KEY }}
          GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DRIVE_FOLDER_NAME: Instagram Videos
          PUBLIC_FOLDER: 'true'
        run: python src/transfer.py
