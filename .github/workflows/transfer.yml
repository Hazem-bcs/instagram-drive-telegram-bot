name: YouTube isolated compatibility test
on:
  workflow_dispatch:
    inputs:
      payload:
        required: true
        type: string
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -q 'yt-dlp[default]' 'bgutil-ytdlp-pot-provider==2.0.2'
      - name: Start isolated token provider
        run: |
          docker run --name bgutil-provider -d --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider:2.0.2
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4416/ping >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Probe requested single public video
        run: |
          python - <<'PY'
          import yt_dlp
          class Logger:
              def debug(self, msg):
                  if 'Generating a' in msg and 'PO Token' in msg:
                      print('Token requested by extractor', flush=True)
              def warning(self, msg): pass
              def error(self, msg): pass
          options = {'js_runtimes':{'node':{}}, 'extractor_args': {'youtube': {'player_client':['mweb']}}, 'noplaylist':True, 'quiet':True,'logger':Logger(), 'socket_timeout':15, 'retries':0}
          try:
              with yt_dlp.YoutubeDL(options) as y:
                  item=y.extract_info('https://www.youtube.com/watch?v=nYYitW53CXI',download=False)
              print('PUBLIC_VIDEO_METADATA_OK', 'duration=',item.get('duration'), 'formats=',len(item.get('formats',[])),flush=True)
          except Exception as exc:
              s=str(exc).lower()
              print('PROBE_FAILED:', 'SIGN_IN_REQUIRED' if any(k in s for k in ['sign in','not a bot','login required']) else 'HTTP_403' if '403' in s else 'NO_FORMATS' if 'format' in s else type(exc).__name__,flush=True)
              raise SystemExit(1)
          PY
      - name: Cleanup
        if: always()
        run: docker rm -f bgutil-provider || true
